[project]
name = "git-autoc"
version = "0.2.1"
description = "AI-powered git commit message generator"
authors = [
    { name = "sanbob", email = "saintsanbob@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.11.8",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "pytest>=8.0.0",
]
