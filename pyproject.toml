[project]
name = "git-autoc"
version = "0.2.1"
description = "AI-powered git commit message generator"
readme = "docs/README.md"
authors = [
    { name = "sanbob", email = "saintsanbob@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "rich>=15.0.0",
]

[project.scripts]
autoc = "git_autoc.main:app"
git-autoc = "git_autoc.main:app"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "pytest>=8.0.0",
]
